plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.example.simpleapp"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.simpleapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // --- INI YANG SAYA TAMBAHKAN ---
    // Memberi tahu Lint untuk tidak menghentikan build (abort) jika menemukan error.
    // Ini adalah solusi untuk error 'MissingClass' dari build sebelumnya.
    lintOptions {
        abortOnError false
    }
    // ---------------------------------
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
}
